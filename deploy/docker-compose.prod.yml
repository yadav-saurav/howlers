# Howlers production stack for a single VPS (see docs/DEPLOYMENT.md).
#   cp deploy/.env.example deploy/.env   # fill in every value
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
# Optional monitoring (Prometheus + Grafana):  add  --profile monitoring
#
# Only Caddy publishes ports (80/443). Postgres, Redis, the S3 service, the backend (8080) and its management port (8081,
# /actuator/prometheus) stay on the internal network.
name: howlers

x-restart: &restart
  restart: unless-stopped

services:
  caddy:
    image: caddy:2.8-alpine
    <<: *restart
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      HOWLERS_DOMAIN: ${HOWLERS_DOMAIN:?set HOWLERS_DOMAIN, e.g. howlers.example.com}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL for certificate notices}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificates: back this up or you'll re-issue on restore
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }

  web:
    build: ../frontend
    image: ${HOWLERS_WEB_IMAGE:-howlers-web:latest}
    <<: *restart
    depends_on:
      backend: { condition: service_healthy }

  backend:
    build: ../backend
    image: ${HOWLERS_BACKEND_IMAGE:-howlers-backend:latest}
    <<: *restart
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }
      clamav: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError}
      APP_PUBLIC_URL: https://${HOWLERS_DOMAIN}
      CORS_ALLOWED_ORIGINS: https://${HOWLERS_DOMAIN}
      COOKIE_SECURE: "true"
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-howlers}
      DATABASE_USER: ${DATABASE_USER:-howlers}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-15}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (openssl rand -base64 48)}
      FILE_VISITOR_SALT: ${FILE_VISITOR_SALT:?set FILE_VISITOR_SALT (openssl rand -hex 32)}
      ACCOUNT_SECRETS_KEY: ${ACCOUNT_SECRETS_KEY:?set ACCOUNT_SECRETS_KEY (openssl rand -base64 32)}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:-}
      FUNDING_DEMO_WEBHOOK_SECRET: ${FUNDING_DEMO_WEBHOOK_SECRET:?set FUNDING_DEMO_WEBHOOK_SECRET (openssl rand -hex 32)}
      FUNDING_ENABLED: ${FUNDING_ENABLED:-true}
      FUNDING_PROVIDER: ${FUNDING_PROVIDER:-demo}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      FUNDING_LIVE_MODE: ${FUNDING_LIVE_MODE:-false}
      FUNDING_COMPLIANCE_ACK: ${FUNDING_COMPLIANCE_ACK:-}
      STRIPE_CONNECT_ENABLED: ${STRIPE_CONNECT_ENABLED:-false}
      STRIPE_CONNECT_LIVE: ${STRIPE_CONNECT_LIVE:-false}
      STRIPE_CONNECT_COUNTRY: ${STRIPE_CONNECT_COUNTRY:-US}
      STRIPE_CONNECT_WEBHOOK_SECRET: ${STRIPE_CONNECT_WEBHOOK_SECRET:-}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://s3:8333
      S3_CREATE_BUCKET: "true"
      S3_PATH_STYLE: "true"
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-howlers}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-howlers}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      # Antivirus (D-029): ClamAV, fail closed (uploads are refused while clamd is unreachable).
      ANTIVIRUS: ${ANTIVIRUS:-clamav}
      ANTIVIRUS_REQUIRED: ${ANTIVIRUS_REQUIRED:-true}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      MANAGEMENT_PORT: "8081"
      MAIL_MODE: ${MAIL_MODE:-smtp}
      # MAIL_FROM is the older name and still accepted.
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-${MAIL_FROM:?set MAIL_FROM_ADDRESS, a sender verified with your mail provider}}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Howlers}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_EFFORT: ${AI_EFFORT:-medium}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_MODEL: ${ELEVENLABS_MODEL:-eleven_multilingual_v2}
      ELEVENLABS_VOICE_A: ${ELEVENLABS_VOICE_A:-XrExE9yKIg1WjnnlVkGX}
      ELEVENLABS_VOICE_B: ${ELEVENLABS_VOICE_B:-JBFqnCBsd6RMkjVDRZzb}
      TTS_DAILY_CHARACTER_BUDGET: ${TTS_DAILY_CHARACTER_BUDGET:-100000}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    expose:
      - "8080"
      - "8081"   # management/metrics: reachable by Prometheus on the internal network only

  postgres:
    image: postgres:17-alpine
    <<: *restart
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-howlers}
      POSTGRES_USER: ${DATABASE_USER:-howlers}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-howlers} -d ${DATABASE_NAME:-howlers}"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 256mb

  # Nightly logical backup, kept for BACKUP_KEEP_DAYS. Copy /backups off the host too (see docs/DEPLOYMENT.md).
  pgbackup:
    image: postgres:17-alpine
    <<: *restart
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: ${DATABASE_USER:-howlers}
      PGPASSWORD: ${DATABASE_PASSWORD}
      PGDATABASE: ${DATABASE_NAME:-howlers}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f="/backups/howlers-$$(date -u +%Y%m%dT%H%M%SZ).dump"
          if pg_dump --format=custom --no-owner --file="$$f.partial"; then
            mv "$$f.partial" "$$f" && echo "backup ok: $$f"
          else
            rm -f "$$f.partial"; echo "backup FAILED" >&2
          fi
          find /backups -name 'howlers-*.dump' -mtime +"$$BACKUP_KEEP_DAYS" -delete
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done

  redis:
    image: redis:7-alpine
    <<: *restart
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for uploads (D-023): SeaweedFS, because MinIO no longer publishes public images.
  # Access is limited to the one identity below (anonymous reads get 403); the backend creates the private bucket on
  # start (S3_CREATE_BUCKET) and proxies every read, so the bucket is never exposed.
  s3:
    image: chrislusf/seaweedfs:4.55
    <<: *restart
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-howlers}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<EOF
        {"identities":[{"name":"howlers","credentials":[{"accessKey":"$$S3_ACCESS_KEY","secretKey":"$$S3_SECRET_KEY"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        EOF
        exec weed server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -volume.max=0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Antivirus for uploads (D-029). Needs ~1-1.5 GB RAM with signatures loaded (plan a 4 GB+ host with the JVM) and
  # downloads signatures on first start; freshclam in the image keeps them updated. Internal only (TCP 3310).
  clamav:
    image: clamav/clamav:1.4.3
    <<: *restart
    volumes:
      - clamav-db:/var/lib/clamav
      - ./clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 300s

  # ---- optional monitoring: docker compose ... --profile monitoring up -d
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    <<: *restart
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus

  grafana:
    image: grafana/grafana:11.3.1
    profiles: ["monitoring"]
    <<: *restart
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://grafana.${HOWLERS_DOMAIN}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana

volumes:
  pgdata:
  s3data:
  clamav-db:
  caddy_data:
  caddy_config:
  promdata:
  grafanadata:
