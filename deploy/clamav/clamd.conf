# clamd settings for the clamav service (D-029). Mounted over the image's /etc/clamav/clamd.conf.
# The image defaults are kept (log file, local socket, TCP 3310, user); the size limits are raised so that every upload
# the backend accepts (MAX_FILE_MB / MAX_MEDIA_MB, 500 MB by default) is actually scanned. With the defaults (25 MB),
# clamd refuses larger INSTREAM uploads ("size limit exceeded"), and files above MaxFileSize are skipped and reported
# clean, which would be a silent pass. Keep these above the backend's limits if you raise them.
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav
StreamMaxLength 600M
MaxFileSize 600M
MaxScanSize 1200M
# Large archives and documents take a while; the backend waits up to CLAMAV_READ_TIMEOUT (120 s by default).
ReadTimeout 180
CommandReadTimeout 30
