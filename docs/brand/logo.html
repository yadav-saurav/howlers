<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Howlers logo (512x512)</title>
<link rel="stylesheet" href="brand.css">
<style>
  body { display: flex; align-items: center; justify-content: center; }
  .tile { position: absolute; inset: 0; border-radius: 0; }
  .mark { position: relative; width: 300px; height: 372px; filter: drop-shadow(0 0 28px rgba(90, 107, 230, 0.6)); }
</style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <img class="mark" src="wolf-mark.svg" alt="">
<script>
  let seed = 11;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
  const host = document.getElementById('stars');
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('span');
    const size = rnd() < 0.15 ? 2.6 : 1.4;
    s.className = 'star';
    Object.assign(s.style, { left: rnd() * 100 + '%', top: rnd() * 100 + '%', width: size + 'px', height: size + 'px', opacity: (0.3 + rnd() * 0.6).toFixed(2) });
    host.appendChild(s);
  }
</script>
</body>
</html>
