<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0b26" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>You're offline · Howlers</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
        background: radial-gradient(900px 520px at 78% 12%, rgba(132, 104, 255, 0.32), transparent 62%), linear-gradient(#07061a, #16123d);
        color: #f6f4ff; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
      }
      main { max-width: 420px; }
      img { width: 88px; height: 88px; }
      h1 { font-size: 26px; margin: 20px 0 8px; letter-spacing: -0.01em; }
      p { color: #c9c4ee; margin: 0 0 24px; }
      a {
        display: inline-block; padding: 10px 20px; border-radius: 999px; font-weight: 600; text-decoration: none;
        background: linear-gradient(92deg, #ffe3a3, #ffc2dc 55%, #c9bcff); color: #1a1238;
      }
      a:focus-visible { outline: 3px solid #8ff0d6; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" />
      <h1>You're offline</h1>
      <p>Howlers can't reach the network right now. Nothing you were reading is saved on this device, so reconnect and try again.</p>
      <a href="">Try again</a>
    </main>
  </body>
</html>
