# WebSocket upgrade for /ws (STOMP). Closes the upstream connection when the client didn't ask to upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Behind a TLS proxy (Caddy in deploy/), keep the original scheme so the API sees HTTPS (secure cookies, HSTS).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Link-preview bots and search crawlers don't run JavaScript, so their page requests get a small HTML document with
# Open Graph / Twitter tags from the backend instead of the SPA shell (D-039). Browsers never match.
map $http_user_agent $howlers_crawler {
    default 0;
    "~*(facebookexternalhit|facebookcatalog|meta-externalagent|Twitterbot|Slackbot|Slack-ImgProxy|Discordbot|WhatsApp|LinkedInBot|TelegramBot|Googlebot|Google-InspectionTool|bingbot|DuckDuckBot|Applebot|YandexBot|Baiduspider|redditbot|Pinterestbot|Embedly|Iframely|SkypeUriPreview|vkShare|Mastodon|Bluesky|Snapchat|Viber)" 1;
}

server {
    listen 80;
    server_tokens off;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 600m;
    proxy_request_buffering off;  # stream large podcast uploads to the backend

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    # CSP (checked in Phase 10, D-026):
    #  - connect-src lists ws(s)://$host explicitly: older Safari doesn't treat 'self' as covering WebSocket URLs (/ws, STOMP).
    #  - style-src keeps 'unsafe-inline': Recharts and Radix set inline style attributes. Scripts stay 'self' only.
    #  - img-src allows https: for link-preview thumbnails; media-src covers podcast audio/video (same origin) and blob: previews.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' wss://$host ws://$host; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz { access_log off; return 200 "ok"; }

    # Resolve the backend through Docker's DNS on every request (cached 10 s) instead of once at startup. With a fixed
    # proxy_pass host, nginx keeps the IP it saw at boot; after the backend container is recreated that IP can belong to
    # a different container (it happened with the storage service), and API calls silently go to the wrong place.
    # A variable proxy_pass without a URI part still forwards the original request URI unchanged.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /ws {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 1h;   # STOMP heartbeats keep it alive; don't cut idle sockets at 60 s
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # robots.txt and sitemaps are generated by the backend from APP_PUBLIC_URL and current public content (D-039).
    location = /robots.txt {
        proxy_pass $backend/api/v1/seo/robots.txt;
        proxy_set_header Host $host;
    }
    location = /sitemap.xml {
        proxy_pass $backend/api/v1/seo/sitemap.xml;
        proxy_set_header Host $host;
    }
    location ~ ^/sitemaps/([a-z]+-[0-9]+)\.xml$ {
        proxy_pass $backend/api/v1/seo/sitemaps/$1.xml;
        proxy_set_header Host $host;
    }

    # The service worker must be revalidated on every update check (expires, unlike add_header, keeps the security headers).
    location = /sw.js {
        expires epoch;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires 1h;
        try_files $uri =404;
    }

    # Real files first; everything else is an SPA route, or a crawler asking for one.
    location / {
        try_files $uri @spa;
    }
    location @spa {
        if ($howlers_crawler) { rewrite ^ /__howlers_preview last; }
        try_files /index.html =404;
    }
    location = /__howlers_preview {
        internal;
        proxy_pass $backend/api/v1/seo/page;
        proxy_set_header X-Howlers-Path $request_uri;   # the original URI; the backend reads only its path
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
